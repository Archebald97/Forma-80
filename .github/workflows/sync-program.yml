name: Sync published workout program
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: forma80-program-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate published Program tab
        run: python3 scripts/sync_program.py
      - name: Commit program changes
        run: |
          if ! git diff --quiet -- program.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add program.json
            git commit -m "Sync approved workout program from published sheet"
            git push
          fi
