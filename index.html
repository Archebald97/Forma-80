'use strict';
const DBKEY='forma80_v1';const CUTOVER='2026-11-23';
// Approved program is bundled offline. Remote Sheets sync requires a separately deployed read-only endpoint.

const E={bench:{name:'Жим гантелей лёжа',muscle:'Грудь · трицепс · передняя дельта',sets:3,min:8,max:12,unit:'одна гантель',weight:20},pull:{name:'Подтягивания',muscle:'Широчайшие · бицепс',sets:3,min:6,max:12,unit:'дополнительный вес',weight:0},incline:{name:'Жим гантелей на наклонной скамье (~30°)',muscle:'Верх груди · трицепс',sets:2,min:8,max:12,unit:'одна гантель',weight:20},pullover:{name:'Пуловер с гантелью',muscle:'Грудь · широчайшие',sets:2,min:10,max:12,unit:'одна гантель',weight:20},pushup:{name:'Отжимания на платформе',muscle:'Грудь · трицепс',sets:2,min:12,max:20,unit:'дополнительный вес',weight:0},hammer:{name:'Молотковые сгибания на бицепс',muscle:'Плечевая мышца · бицепс',sets:3,min:10,max:12,unit:'одна гантель',weight:20},roller:{name:'Ролик для пресса',muscle:'Пресс · мышцы кора',sets:3,min:10,max:10,unit:'дополнительный вес',weight:0},crunch:{name:'Скручивания с гантелью у груди',muscle:'Пресс',sets:3,min:20,max:20,unit:'одна гантель',weight:9},squat:{name:'Приседания с двумя гантелями',muscle:'Квадрицепсы · ягодицы',sets:3,min:12,max:12,unit:'одна гантель',weight:20},rdl:{name:'Румынская тяга с гантелями',muscle:'Задняя поверхность бедра · ягодицы',sets:3,min:8,max:12,unit:'одна гантель',weight:20},row:{name:'Тяга гантелей с упором грудью в скамью',muscle:'Широчайшие · ромбовидные · бицепс',sets:3,min:8,max:12,unit:'одна гантель',weight:20},shrug:{name:'Шраги с гантелями',muscle:'Верх трапеций',sets:3,min:12,max:15,unit:'одна гантель',weight:20},lateral:{name:'Подъёмы гантелей через стороны',muscle:'Средняя дельта',sets:3,min:12,max:15,unit:'одна гантель',weight:9},rear:{name:'Разведения гантелей под углом 30°',muscle:'Задняя дельта',sets:2,min:12,max:15,unit:'одна гантель',weight:9},curl:{name:'Сгибания на бицепс сидя, попеременно',muscle:'Бицепс',sets:3,min:8,max:12,unit:'одна гантель',weight:20},close:{name:'Узкий жим гантелей лёжа нейтральным хватом',muscle:'Трицепс · грудь',sets:2,min:10,max:12,unit:'одна гантель',weight:20},extension:{name:'Разгибание гантели из-за головы на трицепс',muscle:'Трицепс',sets:2,min:10,max:15,unit:'одна гантель',weight:20}};
const T={before:{A:['bench','pull','incline','pullover','pushup','hammer','roller','crunch'],B:['squat','rdl','row','shrug','lateral','rear','curl','close','extension']},after:{A:['bench','incline','pullover','pushup','hammer','curl','extension','roller','crunch'],B:['pull','row','lateral','rear','shrug','squat','rdl','close']}};
const $=id=>document.getElementById(id);const localDate=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const dateText=d=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric',weekday:'long'}).format(new Date(d+'T12:00:00'));const fmt=d=>new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(v,min,max)=>Math.min(max,Math.max(min,Number.isFinite(v)?v:min));
let db;try{db=JSON.parse(localStorage.getItem(DBKEY)||'{}')}catch{db={}}if(!db||typeof db!=='object')db={};if(!db.sessions||typeof db.sessions!=='object')db.sessions={};let ui={page:'workout',date:localDate(),day:'A',open:'bench',historyKey:null,progressEx:'bench'};
// One-time migration: fill only untouched draft sessions, never completed workout data.
if(!db.defaultWeightsV15){
 const ids=['incline','pullover','hammer','rdl','row','shrug','lateral','rear'];
 let changed=false;
 for(const s of Object.values(db.sessions)){
  if(!s||!s.exercises||s.finishedAt)continue;
  const hasDone=Object.values(s.exercises).some(r=>Array.isArray(r?.sets)&&r.sets.some(z=>z.done));
  if(hasDone)continue;
  for(const id of ids){
   const sets=s.exercises[id]?.sets;
   if(!Array.isArray(sets))continue;
   for(const z of sets)if(z&&z.weight===0&&!z.done){z.weight=20;changed=true}
  }
 }
 db.defaultWeightsV15=true;
 try{localStorage.setItem(DBKEY,JSON.stringify(db))}catch(e){console.warn('Weight migration could not be saved',e)}
}
// Preserve every historical session's original exercise list; refresh only untouched future drafts.
if(!db.approvedV2Migration){for(const saved of Object.values(db.sessions)){
 if(!saved?.date||!saved?.day||!saved.exercises)continue;
 const oldIds=Object.keys(saved.exercises);
 const touched=Boolean(saved.finishedAt)||Object.values(saved.exercises).some(v=>v?.sets?.some(z=>z.done));
 if(saved.date>=CUTOVER&&!touched){
  const ids=T.after[saved.day]||oldIds;
  const ex={};
  for(const id of ids){
   const e=E[id],old=saved.exercises[id];
   if(!e)continue;
   ex[id]={sets:Array.from({length:e.sets},(_,i)=>({
    weight:old?.sets?.[i]?.weight===e.weight?old.sets[i].weight:(e.weight??0),
    reps:old?.sets?.[i]?.reps??e.min,done:false,enabled:true
   }))};
  }
  saved.exercises=ex;saved.planIds=[...ids];
 }else if(!saved.planIds)saved.planIds=oldIds;
}
db.approvedV2Migration=true;try{localStorage.setItem(DBKEY,JSON.stringify(db))}catch(e){console.warn('Migration not saved',e)}}
const key=(date,day)=>date+'|'+day;const template=(date,day)=>{const saved=db.sessions?.[key(date,day)];if(saved?.planIds)return saved.planIds;const remote=db.remoteProgram;if(remote&&date>=remote.effectiveDate)return remote.days[day];return T[date>=CUTOVER?'after':'before'][day]};async function syncProgram(){
 try{
  const response=await fetch('./program.json?ts='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const p=await response.json();
  const ids=Object.keys(E);
  if(p.schema!==1||!/^v[0-9]+$/.test(p.version)||!/^\d{4}-\d{2}-\d{2}$/.test(p.effectiveDate)||!p.days||!p.exercises)throw Error('Invalid program');
  for(const day of ['A','B']){
   if(!Array.isArray(p.days[day])||!p.days[day].length||new Set(p.days[day]).size!==p.days[day].length||p.days[day].some(id=>!ids.includes(id)))throw Error('Invalid day');
  }
  for(const [id,v] of Object.entries(p.exercises)){
   if(!ids.includes(id)||!Array.isArray(v)||v.length!==4||v.some(n=>!Number.isFinite(n)||n<0)||v[0]<1||v[0]>10||v[1]>v[2]||v[2]>100||v[3]>500)throw Error('Invalid exercise');
  }
  if(db.remoteProgram?.version===p.version)return;
  // A new version affects only future, entirely untouched drafts.
  for(const [k,saved] of Object.entries(db.sessions)){
   if(!saved||saved.date<p.effectiveDate||saved.finishedAt||!p.days[saved.day])continue;
   if(Object.values(saved.exercises||{}).some(r=>r?.sets?.some(z=>z.done)))continue;
   const ex={};
   for(const id of p.days[saved.day]){
    const e=E[id],v=p.exercises[id]||[e.sets,e.min,e.max,e.weight||0];
    ex[id]={sets:Array.from({length:v[0]},(_,i)=>({weight:v[3],reps:v[1],done:false,enabled:true}))};
   }
   saved.exercises=ex;saved.planIds=[...p.days[saved.day]];
  }
  for(const [id,v] of Object.entries(p.exercises)){Object.assign(E[id],{sets:v[0],min:v[1],max:v[2],weight:v[3]});}
  db.remoteProgram={version:p.version,effectiveDate:p.effectiveDate,days:p.days,exercises:p.exercises};
  save();render();
 }catch(err){console.warn('Program sync unavailable; offline plan retained',err)}
}
if(db.remoteProgram?.exercises){for(const [id,v] of Object.entries(db.remoteProgram.exercises)){if(E[id]&&Array.isArray(v)&&v.length===4)Object.assign(E[id],{sets:v[0],min:v[1],max:v[2],weight:v[3]});}}
const allSessions=()=>Object.values(db.sessions).filter(x=>x&&x.date&&x.day&&x.exercises).sort((a,b)=>b.date.localeCompare(a.date)||b.day.localeCompare(a.day));
function prior(exid,date,day){return allSessions().filter(s=>s.date<date&&s.exercises[exid]&&s.exercises[exid].sets?.some(z=>z.done)).sort((a,b)=>b.date.localeCompare(a.date))[0]?.exercises[exid]||null}
function session(date=ui.date,day=ui.day){let k=key(date,day);if(!db.sessions[k]){const ids=template(date,day);let exercises={};for(const id of ids){let e=E[id],p=prior(id,date,day);let n=e.sets+(e.optional||0);exercises[id]={sets:Array.from({length:n},(_,i)=>{let old=p?.sets?.[i];let weight=old?.done?old.weight:(p?.sets?.find(z=>z.done)?.weight??e.weight??0);let reps=old?.reps??e.min;return {weight,reps,done:false,enabled:i<e.sets}})}}db.sessions[k]={date,day,planIds:[...ids],exercises,note:'',createdAt:new Date().toISOString()};save()}return db.sessions[k]}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(db));return true}catch(e){toast('Не удалось сохранить! Экспортируй резервную копию.');return false}}
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2400)}
function stats(s){let total=0,done=0,reps=0,volume=0;for(const id of template(s.date,s.day)){let e=s.exercises[id];if(!e)continue;for(const z of e.sets||[]){if(!z.enabled)continue;total++;if(z.done){done++;reps+=z.reps;let factor=['bench','incline','squat','rdl','row','shrug','lateral','rear','hammer','curl','close'].includes(id)?2:1;volume+=z.weight*z.reps*factor}}}return {total,done,reps,volume}}
function render(){for(const p of ['workout','history','progress','analytics','settings']){$(p).classList.toggle('active',p===ui.page);document.querySelector(`[data-page="${p}"]`).classList.toggle('active',p===ui.page)}if(ui.page==='workout')renderWorkout();if(ui.page==='history')renderHistory();if(ui.page==='progress')renderProgress();if(ui.page==='analytics')renderAnalytics();if(ui.page==='settings')renderSettings()}
function renderWorkout(){let s=session(),ids=template(ui.date,ui.day),st=stats(s);if(!ids.includes(ui.open))ui.open=ids[0];let html=`<div class="card"><div class="row"><b>Дата тренировки</b><span class="chip">${esc(dateText(ui.date).split(',')[0])}</span></div><input aria-label="Дата тренировки" class="date" type="date" id="dateInput" value="${ui.date}"><div class="tabs"><button data-day="A" class="${ui.day==='A'?'active':''}">День А</button><button data-day="B" class="${ui.day==='B'?'active':''}">День Б</button></div><p class="small muted">${ui.date>=CUTOVER?'Программа с 23 ноября 2026':'Программа до 22 ноября 2026'} · ${ui.day==='A'?'грудь / руки / спина / пресс':'ноги / спина / плечи / руки'}</p><div class="metrics"><div class="metric"><span class="label">Подходы</span><b>${st.done}/${st.total}</b></div><div class="metric"><span class="label">Готово</span><b>${Math.round(100*st.done/st.total)}%</b></div><div class="metric"><span class="label">Повторы</span><b>${st.reps}</b></div></div><div class="bar"><div style="width:${100*st.done/st.total}%"></div></div><div class="row"><span class="label">Объём выполненных подходов</span><b>${num(st.volume)} кг</b></div>${s.finishedAt?'<p class="detail" style="color:#6ee7b7">✓ Тренировка завершена и зафиксирована</p>':'<p class="detail">Тренировка ещё не завершена</p>'}</div><div class="row" style="margin:20px 2px 8px"><h2>Упражнения · День ${ui.day}</h2><span class="muted small">${ids.length} упражнений</span></div>`;
ids.forEach((id,i)=>{let e=E[id],r=s.exercises[id],z=r.sets.filter(x=>x.enabled),complete=z.length&&z.every(x=>x.done),count=z.filter(x=>x.done).length,open=ui.open===id;html+=`<article class="card exercise"><button class="exhead" data-open="${id}"><span class="number ${complete?'done':''}">${complete?'✓':i+1}</span><span style="flex:1"><span class="exname">${esc(e.name)}</span><div class="exmeta">${esc(e.muscle)}<br>${e.sets}${e.optional?'–'+(e.sets+e.optional):''} × ${e.min===e.max?e.min:e.min+'–'+e.max} · выполнено ${count}/${z.length}</div></span><span class="arrow">${open?'⌃':'⌄'}</span></button>`;

function renderProgress(){let ids=Object.keys(E),sel=ui.progressEx,rows=allSessions().filter(s=>s.exercises[sel]&&s.exercises[sel].sets.some(x=>x.done));let html=`<div class="card"><h2>Прогресс по упражнению</h2><label class="label" for="progressSelect">Выбери упражнение</label><select id="progressSelect" class="select">${ids.map(id=>`<option value="${id}" ${id===sel?'selected':''}>${esc(E[id].name)}</option>`).join('')}</select><p class="small muted">Рабочий вес — максимальный вес выполненного подхода. Объём учитывает число гантелей для двусторонних упражнений.</p>`;if(!rows.length)html+='<div class="empty">Пока нет выполненных подходов по этому упражнению.</div>';else{let vals=rows.map(s=>({date:s.date,day:s.day,sets:s.exercises[sel].sets.filter(x=>x.done)}));let max=Math.max(...vals.flatMap(v=>v.sets.map(x=>x.weight)),1);html+='<h3 style="margin:16px 0 10px">Рабочие веса</h3>';vals.slice().reverse().slice(-12).forEach(v=>{let w=Math.max(...v.sets.map(x=>x.weight));html+=`<div class="row small" style="margin:8px 0"><span style="min-width:93px">${fmt(v.date)}</span><div class="bar" style="flex:1;margin:0"><div style="width:${100*w/max}%"></div></div><b style="min-width:52px;text-align:right">${num(w)} кг</b></div>`});let chronological=vals.slice().reverse();let points=chronological.slice(-16).map(v=>({date:v.date,weight:Math.max(...v.sets.map(x=>x.weight)),volume:v.sets.reduce((a,x)=>a+x.weight*x.reps*(['bench','incline','squat','rdl','row','shrug','lateral','rear','hammer','curl','close'].includes(sel)?2:1),0)}));html+='<h3 style="margin:20px 0 10px">График рабочего веса</h3>'+lineChart(points,'weight','кг')+'<h3 style="margin:20px 0 10px">График тренировочного объёма</h3>'+lineChart(points,'volume','кг')+'<h3 style="margin:20px 0 10px">История подходов</h3>';vals.forEach(v=>{html+=`<div class="history-item"><div class="row"><b>${fmt(v.date)} · ${v.day}</b><span class="small muted">${v.sets.reduce((a,x)=>a+x.reps,0)} повт.</span></div><div class="detail">${v.sets. function lineChart(rows,field,unit){if(!rows.length)return '<p class="detail">Пока нет данных</p>';const W=330,H=155,P=28,values=rows.map(r=>r[field]),hi=Math.max(...values,1),lo=Math.min(0,...values),range=Math.max(1,hi-lo);const pts=rows.map((r,i)=>({x:P+(rows.length===1?.5:i/(rows.length-1))*(W-2*P),y:H-P-(r[field]-lo)/range*(H-2*P)}));let path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График ${field==='weight'?'рабочего веса':'объёма'} по датам" style="width:100%;height:auto;background:#142632;border-radius:12px"><path d="M${P} ${P}V${H-P}H${W-P}" fill="none" stroke="#506879"/><path d="${path}" fill="none" stroke="#54dbbd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#b6ffe5"><title>${esc(fmt(rows[i].date))}: ${num(rows[i][field])} ${unit}</title></circle>`).join('')}<text x="${P}" y="18" font-size="12" fill="#d9e8ee">Макс. ${num(hi)} ${unit}</text><text x="${P}" y="${H-6}" font-size="10" fill="#9eb4c2">${esc(fmt(rows[0].date))}</text><text x="${W-P}" y="${H-6}" font-size="10" text-anchor="end" fill="#9eb4c2">${esc(fmt(rows[rows.length-1].date))}</text></svg>`} 
function renderAnalytics(){
 const rows=allSessions().filter(s=>stats(s).done>0);
 const done=rows.filter(s=>Boolean(s.finishedAt));
 const sets=rows.reduce((n,s)=>n+stats(s).done,0);
 const volume=rows.reduce((n,s)=>n+stats(s).volume,0);
 const weekMap=new Map();
 for(const s of rows){
  const d=new Date(s.date+'T12:00:00'),weekday=(d.getDay()+6)%7;
  d.setDate(d.getDate()-weekday);
  const w=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const old=weekMap.get(w)||{date:w,volume:0,sets:0,workouts:0};
  const st=stats(s);old.volume+=st.volume;old.sets+=st.done;old.workouts++;weekMap.set(w,old);
 }
 const weeks=[...weekMap.values()].sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
 let html='<div class="card"><h2>Аналитика · Форма 80</h2><p class="small muted">Только реальные записи из дневника. Незавершённые тренировки с отмеченными подходами тоже учитываются.</p><div class="metrics"><div class="metric"><span class="label">Тренировки</span><b>'+rows.length+'</b></div><div class="metric"><span class="label">Подходы</span><b>'+sets+'</b></div><div class="metric"><span class="label">Объём, кг</span><b style="font-size:18px">'+num(volume)+'</b></div></div><p class="detail">Завершённых тренировок: '+done.length+'. Объём рассчитан по весу и повторам, с учётом двух гантелей в двусторонних упражнениях; для упражнений с собственным весом он не отражает всю нагрузку.</p></div>';
 html+='<div class="card"><h3>Нагрузка по неделям</h3><p class="small muted">Суммарный записанный объём силовых подходов</p>';
 if(!weeks.length)html+='<div class="empty">После первого выполненного подхода здесь появится статистика.</div>';
 else {const max=Math.max(1,...weeks.map(w=>w.volume));for(const w of weeks){html+='<div class="row small" style="margin:11px 0"><span style="min-width:88px">'+esc(fmt(w.date))+'</span><div class="bar" style="flex:1;margin:0"><div style="width:'+Math.round(w.volume/max*100)+'%"></div></div><b style="min-width:74px;text-align:right">'+num(w.volume)+' кг</b></div>';}html+='<p class="detail">За последние '+weeks.length+' недель с записями. Пустые недели не отображаются.</p>';}
 html+='</div><div class="card"><h3>Показатели Health Connect</h3><p class="small muted">Сон · пульс · шаги · активность</p><div class="notice">Пока не подключены к приложению. Показатели появятся только после проверки архивов и настройки безопасного импорта. Никакие данные о здоровье не публикуются в GitHub.</div></div>';
 $('analytics').innerHTML=html;
}
function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>Сохранение данных</h2><p class="muted small">После каждого изменения запись сохраняется автоматически в памяти приложения. Это не облачная синхронизация. Не очищай данные сайта, если не сохранил резервную копию.</p><div class="btnrow"><button class="btn primary" id="export">↓ Скачать резервную копию</button><button class="btn" id="import">↑ Восстановить из файла</button></div><p class="detail">При обновлении с v1.0: сначала скачай копию в старой версии, затем восстанови её здесь. Импорт поддерживает копии v1.0 и v1.1. Импорт заменяет все текущие записи. Перед импортом рекомендуем скачать резервную копию.</p><p class="small muted">Сохранённых тренировок с выполненными подходами: ${allSessions().filter(s=>stats(s).done>0).length}</p></div><div class="card"><h2>Программа тренировок</h2><p class="small muted">До 22 ноября 2026 — исходные дни А/Б. С 23 ноября 2026 — утверждённый порядок и веса программы v2. Обновление программы через program.json при запуске; прямая синхронизация с Google Таблицей ещё не подключена. День C не включён.</p><p class="small muted">Источник: утверждённая программа v2 в Google Таблице. Начальные веса из документа — ориентиры, а не новые назначения нагрузки. Для остальных упражнений вес вводится вручную.</p></div><div class="card"><h2>Переход с v1.0</h2><p class="small muted">Открой старый файл forma80.html, нажми «Данные → Скачать резервную копию». Затем в этой версии нажми «Восстановить из файла» и выбери скачанный JSON. Перед восстановлением здесь тоже можно скачать копию. Если история уже видна — повторный импорт не нужен.</p></div><div class="card"><h2>Удаление</h2><p class="small muted">Удаление всех записей необратимо без резервной копии.</p><button class="btn danger" id="wipe">Удалить все локальные записи</button></div>`;$('export').onclick=exportData;$('import').onclick=()=>$('importFile').click();$('wipe').onclick=()=>{if(confirm('Удалить ВСЕ локальные записи «Форма 80»?')){db={sessions:{}};save();render();toast('Записи удалены')}}}
function exportData(){let payload={app:'forma80',version:2,exportedAt:new Date().toISOString(),sessions:db.sessions};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forma80-backup-'+localDate()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия подготовлена')}
$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='forma80'||![1,2].includes(obj.version)||!obj.sessions||typeof obj.sessions!=='object'||Array.isArray(obj.sessions))throw Error('Неверный формат резервной копии');for(const [k,s] of Object.entries(obj.sessions)){if(!/^\d{4}-\d{2}-\d{2}\|[AB]$/.test(k)||!s||typeof s.exercises!=='object'||!s.exercises)throw Error('Повреждённая запись');for(const [id,r] of Object.entries(s.exercises)){if(!E[id]||!Array.isArray(r.sets)||r.sets.length>10)throw Error('Неверное упражнение');for(const z of r.sets){if(!Number.isFinite(z.weight)||!Number.isInteger(z.reps)||z.weight<0||z.weight>500||z.reps<0||z.reps>500||typeof z.done!=='boolean'||typeof z.enabled!=='boolean')throw Error('Неверный подход')}}}if(confirm('Заменить все текущие записи данными из резервной копии?')){db={sessions:obj.sessions};save();ui.page='history';render();toast('Резервная копия восстановлена')}}catch(err){alert('Не удалось импортировать файл: '+err.message)}finally{e.target.value=''}};
